name: Refresh Nobel Forecast

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nobel-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check Zhihu secret exists
        env:
          ZHIHU_ACCESS_SECRET: ${{ secrets.ZHIHU_ACCESS_SECRET }}
        run: |
          python3 -c "import os; assert os.environ.get('ZHIHU_ACCESS_SECRET', '').strip(), 'Add ZHIHU_ACCESS_SECRET in repository Settings > Secrets and variables > Actions'"
      - name: Install official CLI
        run: python3 scripts/ci/install_zhihu_cli.py
      - name: Fetch, review and rebuild
        env:
          ZHIHU_ACCESS_SECRET: ${{ secrets.ZHIHU_ACCESS_SECRET }}
          ZHIHU_CLI_BINARY: ${{ runner.temp }}/zhihu-cli
        run: python3 scripts/sync.py
      - name: Validate results
        run: |
          python3 -m unittest discover -s tests
          node --check public/app.js
      - name: Save snapshots and review cache
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/snapshots data/reviews.json data/ai-audit public/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Nobel forecast data and review cache'
            git push origin HEAD:main
          fi
  publish:
    needs: refresh
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
